# Each round is one `## Round <n> · r-<id>` section, appended, carrying exactly these fields and lists. Verify a round against this file before returning.
header:          # above the rounds, once
  - Rounds
  - Started
fields:          # a round's, in this order, one per line
  - Date
  - By
  - Diff
  - Axes
  - Verdict
  - Score
lists:
  - Criteria     # the plan's criteria. Absent when functional did not run, or ran with none
  - Findings     # defects no criterion covers. Absent when none was found
